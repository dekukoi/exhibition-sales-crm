[project]
name = "exhibition-crm-backend"
version = "0.1.0"
description = "Exhibition sales CRM backend (FastAPI + SQLAlchemy + Alembic)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.121.2",
    "uvicorn[standard]==0.38.0",
    "sqlalchemy==2.0.44",
    "alembic==1.17.1",
    "psycopg[binary]==3.2.12",
    "pydantic==2.12.3",
    "pydantic-settings==2.11.0",
    "tzdata==2025.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "httpx==0.28.1",
    "ruff==0.14.4",
    "mypy==1.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
